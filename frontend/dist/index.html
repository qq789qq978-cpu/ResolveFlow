<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ResolveFlow · 售后运营工作台</title><link rel="stylesheet" href="style.css?v=1.4.1"></head><body>
<aside><div class="brand">R<span>ResolveFlow</span></div><p>售后运营工作台</p><nav><button data-filter="">全部工单</button><button data-filter="awaiting_approval">待审批</button><button data-filter="escalated">人工核查</button><button data-filter="failed">运行异常</button></nav><div class="note">订单使用合成数据<br>退款仅记入模拟台账</div></aside>
<main><header><div><small>SUPPORT OPERATIONS</small><h1>工单处理</h1></div><div><span id="mode">等待连接</span> <button id="logout" class="secondary" hidden>切换角色</button></div></header><p id="connection" role="status" aria-live="polite" hidden></p><section id="login"><h2>连接工作台</h2><form id="authform"><label>角色授权码<input id="key" type="password" required autocomplete="off" placeholder="输入运营、审批或管理员授权码"></label><button>连接</button></form><p>授权码仅保留在当前页面内存，刷新后重新输入。</p></section>
<div id="workspace" hidden><section id="monitor" hidden><h2>运行监控</h2><p id="metrics">读取中…</p></section><section id="createpanel"><div class="section-head"><h2>创建工单</h2><span>01 / 接收诉求</span></div><form id="createform"><div class="compose"><label>关联订单<select id="order" required></select></label><label>客户诉求<textarea id="ticket" required minlength="2" maxlength="4000" rows="3" placeholder="例如：商品未使用，签收三天，申请退款"></textarea></label></div><button id="submit">开始调查</button><small>条件全满足自动模拟退款，全不满足自动拒绝，部分满足人工审批。</small></form></section>
<section><div class="section-head"><h2 id="listtitle">全部工单</h2><button class="secondary" id="refresh">刷新</button></div><div class="tablewrap" tabindex="0" role="region" aria-label="工单列表，可横向滚动"><table><thead><tr><th>客户诉求 / 工单</th><th>订单</th><th>处理状态</th><th>创建时间</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><div class="paging"><button id="prev" class="secondary">上一页</button><span id="page">第 1 页</span><button id="next" class="secondary">下一页</button></div></section>
<section id="knowledgepanel"><h2>政策知识库</h2><p>输入售后问题，查看相关政策原文与来源。没有依据时应转人工核查。</p><form id="knowledgeform"><label>查询政策<input id="knowledgequery" required minlength="2" maxlength="4000" placeholder="例如：包裹丢失怎么办"></label><button id="knowledgesubmit">检索政策</button></form><div id="knowledgeresults" aria-live="polite"></div></section><section id="detail" hidden><div class="section-head"><h2>工单详情</h2><span id="detailstatus"></span></div><p id="description"></p><div class="cards"><article><h3>订单事实</h3><div id="facts"></div></article><article><h3>处理建议</h3><div id="proposal"></div></article></div><div id="conflicts" class="warning" hidden></div><h3>退款条件核验</h3><div id="checks"></div><h3>政策依据</h3><div id="citationstatus" role="status"></div><div id="citationquotes"></div><div id="evidence"></div><h3>调查记录</h3><div id="trace"></div><div id="approval" hidden><h3>人工审批</h3><label>审批理由<textarea id="reason" maxlength="1000" rows="2"></textarea></label><button id="accept">批准模拟退款</button><button class="secondary" id="reject">拒绝退款</button></div><div id="review" hidden><h3>人工核查结果</h3><label>处理说明<textarea id="resolution" maxlength="2000" rows="2" placeholder="说明核查结论或已联系客户补充的信息"></textarea></label><button id="closecase">记录并关闭工单</button></div><p id="jobinfo"></p><button id="retry" class="secondary" hidden>重试任务</button><div id="audit"></div></section></div><p id="message" role="status" aria-live="polite"></p></main><script src="app.js?v=2.5.0"></script></body></html>
