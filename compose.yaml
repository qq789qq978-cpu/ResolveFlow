x-alert-env: &alert-env
  RF_EXPECTED_WORKERS: ${RF_EXPECTED_WORKERS:-1}
  RF_ALERT_WORKER_OFFLINE_SECONDS: ${RF_ALERT_WORKER_OFFLINE_SECONDS:-20}
  RF_ALERT_RUNNING_SECONDS: ${RF_ALERT_RUNNING_SECONDS:-120}
  RF_ALERT_QUEUED_SECONDS: ${RF_ALERT_QUEUED_SECONDS:-60}
  RF_ALERT_FAILURE_COUNT: ${RF_ALERT_FAILURE_COUNT:-3}
  RF_ALERT_FAILURE_WINDOW_SECONDS: ${RF_ALERT_FAILURE_WINDOW_SECONDS:-900}
x-event-logs: &event-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:17}
    environment:
      POSTGRES_USER: resolveflow
      POSTGRES_DB: resolveflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resolveflow -d resolveflow"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  resolveflow:
    logging: *event-logs
    build: .
    image: ${RESOLVEFLOW_IMAGE:-resolveflow:local}
    ports:
      - "127.0.0.1:${APP_PORT:-8003}:8000"
    environment: &application-env
      <<: *alert-env
      DATABASE_URL: postgresql://rf_app:${RF_APP_PASSWORD:?Set RF_APP_PASSWORD}@db:5432/resolveflow
      READONLY_DATABASE_URL: postgresql://rf_readonly:${RF_READONLY_PASSWORD:?Set RF_READONLY_PASSWORD}@db:5432/resolveflow
      RF_ENFORCE_DB_ROLES: '1'
      RF_DB_POOL_MAX: ${RF_DB_POOL_MAX:-8}
      RF_DB_POOL_MAX_WAITING: ${RF_DB_POOL_MAX_WAITING:-16}
      RF_DB_POOL_TIMEOUT_MS: ${RF_DB_POOL_TIMEOUT_MS:-2000}
      RF_DB_STATEMENT_TIMEOUT_MS: ${RF_DB_STATEMENT_TIMEOUT_MS:-10000}
      RF_DB_LOCK_TIMEOUT_MS: ${RF_DB_LOCK_TIMEOUT_MS:-5000}
      RF_DB_IDLE_TRANSACTION_TIMEOUT_MS: ${RF_DB_IDLE_TRANSACTION_TIMEOUT_MS:-240000}
      RF_TASK_TIMEOUT_SECONDS: ${RF_TASK_TIMEOUT_SECONDS:-180}
      APP_API_KEY: ${APP_API_KEY:?Set APP_API_KEY}
      REVIEWER_API_KEY: ${REVIEWER_API_KEY:?Set REVIEWER_API_KEY}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY}
      MODE: ${MODE:-live}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com}
      MODEL_NAME: ${MODEL_NAME:-deepseek-flash}
      DATA_DIR: /data
      RETRIEVAL_MODE: ${RETRIEVAL_MODE:-bm25}
      SEMANTIC_WEIGHT: ${SEMANTIC_WEIGHT:-0.25}
      EMBEDDING_URL: http://embedding:8080
    networks: [default, embedding-private]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - agent-data:/data
    restart: unless-stopped
  migrate:
    image: ${RESOLVEFLOW_IMAGE:-resolveflow:local}
    build: .
    command: ["python", "db_migrate.py", "prepare"]
    networks: [default, embedding-private]
    environment:
      DATABASE_URL: postgresql://rf_migrator:${RF_MIGRATOR_PASSWORD:?Set RF_MIGRATOR_PASSWORD}@db:5432/resolveflow
      RF_ENFORCE_DB_ROLES: '1'
      MODE: ${MODE:-live}
      RETRIEVAL_MODE: ${RETRIEVAL_MODE:-bm25}
      EMBEDDING_URL: http://embedding:8080
    depends_on:
      db:
        condition: service_healthy
      db-roles:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    restart: "no"
  db-roles:
    image: ${RESOLVEFLOW_IMAGE:-resolveflow:local}
    build: .
    command: ["python", "db_roles.py", "provision"]
    environment:
      DATABASE_URL: postgresql://resolveflow:${POSTGRES_PASSWORD}@db:5432/resolveflow
      RF_MIGRATOR_PASSWORD: ${RF_MIGRATOR_PASSWORD:?Set RF_MIGRATOR_PASSWORD}
      RF_APP_PASSWORD: ${RF_APP_PASSWORD:?Set RF_APP_PASSWORD}
      RF_READONLY_PASSWORD: ${RF_READONLY_PASSWORD:?Set RF_READONLY_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"
  worker:
    logging: *event-logs
    init: true
    image: ${RESOLVEFLOW_IMAGE:-resolveflow:local}
    build: .
    command: ["python", "worker.py"]
    environment: *application-env
    networks: [default, embedding-private]
    depends_on:
      resolveflow:
        condition: service_healthy
    volumes:
      - worker-data:/data
    healthcheck:
      test: ["CMD", "python", "worker_health.py"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  monitor:
    logging: *event-logs
    image: ${RESOLVEFLOW_IMAGE:-resolveflow:local}
    build: .
    command: ["python", "monitor.py"]
    environment:
      <<: *alert-env
      READONLY_DATABASE_URL: postgresql://rf_readonly:${RF_READONLY_PASSWORD:?Set RF_READONLY_PASSWORD}@db:5432/resolveflow
      RF_ALERT_POLL_SECONDS: ${RF_ALERT_POLL_SECONDS:-5}
      RF_ALERT_STARTUP_GRACE_SECONDS: ${RF_ALERT_STARTUP_GRACE_SECONDS:-30}
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import json,time,os;from pathlib import Path;h=json.loads(Path('/tmp/resolveflow-monitor-health.json').read_text());raise SystemExit(0 if h['available'] and time.time()-h['time']<max(30,int(os.getenv('RF_ALERT_POLL_SECONDS','5'))*2+20) else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
  embedding:
    profiles: [semantic]
    image: resolveflow:embedding-local
    build:
      context: .
      dockerfile: embedding/Dockerfile
    cpus: 2
    mem_limit: 2g
    networks: [embedding-private]
    volumes:
      - type: bind
        source: ${RF_EMBEDDING_MODEL_DIR:-./models/multilingual-e5-small}
        target: /model
        read_only: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
networks:
  embedding-private:
    internal: true
volumes:
  postgres-data:
  agent-data:
  worker-data:
